<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" font-family="Verdana, sans-serif">
  <rect width="800" height="420" fill="#0f172a"/>
  <text x="400" y="35" text-anchor="middle" fill="#e2e8f0" font-size="20" font-weight="bold">WebSocket: Persistent Full-Duplex Connection</text>

  <rect x="30" y="90" width="160" height="80" rx="10" fill="#1e40af" stroke="#93c5fd" stroke-width="2"/>
  <text x="110" y="125" text-anchor="middle" fill="white" font-size="14" font-weight="bold">Client A</text>
  <text x="110" y="145" text-anchor="middle" fill="#cbd5e1" font-size="11">(Chat User 1)</text>

  <rect x="320" y="90" width="160" height="80" rx="10" fill="#166534" stroke="#86efac" stroke-width="2"/>
  <text x="400" y="125" text-anchor="middle" fill="white" font-size="14" font-weight="bold">WS Server</text>
  <text x="400" y="145" text-anchor="middle" fill="#dcfce7" font-size="11">(Chat Relay)</text>

  <rect x="610" y="90" width="160" height="80" rx="10" fill="#1e40af" stroke="#93c5fd" stroke-width="2"/>
  <text x="690" y="125" text-anchor="middle" fill="white" font-size="14" font-weight="bold">Client B</text>
  <text x="690" y="145" text-anchor="middle" fill="#cbd5e1" font-size="11">(Chat User 2)</text>

  <line x1="190" y1="115" x2="320" y2="115" stroke="#facc15" stroke-width="2" marker-end="url(#arrow5)"/>
  <text x="255" y="105" text-anchor="middle" fill="#facc15" font-size="10">Upgrade</text>
  <line x1="320" y1="130" x2="190" y2="130" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow5)"/>
  <text x="255" y="150" text-anchor="middle" fill="#38bdf8" font-size="10">101 Switch</text>

  <line x1="480" y1="115" x2="610" y2="115" stroke="#facc15" stroke-width="2" marker-end="url(#arrow5)"/>
  <text x="545" y="105" text-anchor="middle" fill="#facc15" font-size="10">Upgrade</text>
  <line x1="610" y1="130" x2="480" y2="130" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow5)"/>
  <text x="545" y="150" text-anchor="middle" fill="#38bdf8" font-size="10">101 Switch</text>

  <rect x="60" y="200" width="680" height="30" rx="6" fill="#334155"/>
  <text x="400" y="220" text-anchor="middle" fill="#e2e8f0" font-size="12">Both sockets now stay OPEN — persistent TCP connections</text>

  <line x1="190" y1="260" x2="320" y2="260" stroke="#f472b6" stroke-width="2.5" marker-end="url(#arrow5)"/>
  <text x="255" y="250" text-anchor="middle" fill="#f472b6" font-size="11">send("Hello!")</text>

  <line x1="480" y1="290" x2="610" y2="290" stroke="#f472b6" stroke-width="2.5" marker-end="url(#arrow5)"/>
  <text x="545" y="280" text-anchor="middle" fill="#f472b6" font-size="11">push("Hello!")</text>

  <line x1="610" y1="330" x2="480" y2="330" stroke="#a3e635" stroke-width="2.5" marker-end="url(#arrow5)"/>
  <text x="545" y="320" text-anchor="middle" fill="#a3e635" font-size="11">send("Hi back!")</text>

  <line x1="320" y1="360" x2="190" y2="360" stroke="#a3e635" stroke-width="2.5" marker-end="url(#arrow5)"/>
  <text x="255" y="350" text-anchor="middle" fill="#a3e635" font-size="11">push("Hi back!")</text>

  <text x="400" y="400" text-anchor="middle" fill="#64748b" font-size="12">Server pushes data instantly — no client polling required</text>

  <defs>
    <marker id="arrow5" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#facc15"/>
    </marker>
  </defs>
</svg>

<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" font-family="Verdana, sans-serif">
  <rect width="800" height="400" fill="#0f172a"/>
  <text x="400" y="35" text-anchor="middle" fill="#e2e8f0" font-size="20" font-weight="bold">SOAP: XML Envelope over HTTP</text>

  <!-- Client -->
  <rect x="40" y="90" width="180" height="90" rx="10" fill="#1e40af" stroke="#93c5fd" stroke-width="2"/>
  <text x="130" y="130" text-anchor="middle" fill="white" font-size="16" font-weight="bold">Client App</text>
  <text x="130" y="152" text-anchor="middle" fill="#cbd5e1" font-size="12">(Budgeting App)</text>

  <!-- WSDL box -->
  <rect x="40" y="230" width="180" height="70" rx="10" fill="#334155" stroke="#64748b" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="130" y="258" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="bold">WSDL Contract</text>
  <text x="130" y="276" text-anchor="middle" fill="#94a3b8" font-size="11">defines operations</text>

  <!-- Server -->
  <rect x="580" y="90" width="180" height="90" rx="10" fill="#166534" stroke="#86efac" stroke-width="2"/>
  <text x="670" y="130" text-anchor="middle" fill="white" font-size="16" font-weight="bold">SOAP Server</text>
  <text x="670" y="152" text-anchor="middle" fill="#dcfce7" font-size="12">(Bank Service)</text>

  <!-- DB -->
  <ellipse cx="670" cy="290" rx="90" ry="35" fill="#7c2d12" stroke="#fdba74" stroke-width="2"/>
  <text x="670" y="295" text-anchor="middle" fill="white" font-size="13" font-weight="bold">Accounts DB</text>

  <!-- Arrows -->
  <line x1="220" y1="125" x2="580" y2="125" stroke="#facc15" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="400" y="112" text-anchor="middle" fill="#facc15" font-size="12">1. POST SOAP Envelope (XML)</text>

  <line x1="580" y1="160" x2="220" y2="160" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="400" y="180" text-anchor="middle" fill="#38bdf8" font-size="12">4. SOAP Response / Fault</text>

  <line x1="130" y1="180" x2="130" y2="230" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="150" y="210" fill="#94a3b8" font-size="10">validate</text>

  <line x1="670" y1="180" x2="670" y2="255" stroke="#fdba74" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="695" y="220" fill="#fdba74" font-size="11">2. Execute</text>
  <text x="695" y="234" fill="#fdba74" font-size="11">   transaction</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#facc15"/>
    </marker>
  </defs>

  <text x="400" y="365" text-anchor="middle" fill="#64748b" font-size="12">Strict schema validation + WS-Security ensures reliable, auditable transactions</text>
</svg>

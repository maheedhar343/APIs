<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" font-family="Verdana, sans-serif">
  <rect width="800" height="400" fill="#0f172a"/>
  <text x="400" y="35" text-anchor="middle" fill="#e2e8f0" font-size="20" font-weight="bold">REST: Resources over Stateless HTTP</text>

  <rect x="40" y="150" width="180" height="90" rx="10" fill="#1e40af" stroke="#93c5fd" stroke-width="2"/>
  <text x="130" y="190" text-anchor="middle" fill="white" font-size="16" font-weight="bold">Client</text>
  <text x="130" y="212" text-anchor="middle" fill="#cbd5e1" font-size="12">(Mobile Weather App)</text>

  <rect x="580" y="150" width="180" height="90" rx="10" fill="#166534" stroke="#86efac" stroke-width="2"/>
  <text x="670" y="190" text-anchor="middle" fill="white" font-size="16" font-weight="bold">REST API Server</text>
  <text x="670" y="212" text-anchor="middle" fill="#dcfce7" font-size="12">(Router + Controller)</text>

  <ellipse cx="670" cy="320" rx="90" ry="35" fill="#7c2d12" stroke="#fdba74" stroke-width="2"/>
  <text x="670" y="325" text-anchor="middle" fill="white" font-size="13" font-weight="bold">Database</text>

  <line x1="220" y1="180" x2="580" y2="180" stroke="#facc15" stroke-width="2.5" marker-end="url(#arrow2)"/>
  <text x="400" y="167" text-anchor="middle" fill="#facc15" font-size="12">1. GET /cities/hyderabad/forecast</text>

  <line x1="580" y1="215" x2="220" y2="215" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow2)"/>
  <text x="400" y="235" text-anchor="middle" fill="#38bdf8" font-size="12">4. 200 OK { JSON }</text>

  <line x1="670" y1="240" x2="670" y2="285" stroke="#fdba74" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="695" y="265" fill="#fdba74" font-size="11">2. Query</text>

  <line x1="700" y1="285" x2="700" y2="240" stroke="#fdba74" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="710" y="265" fill="#fdba74" font-size="11">3. Result</text>

  <rect x="280" y="270" width="240" height="70" rx="8" fill="#334155" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="400" y="292" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="bold">Stateless</text>
  <text x="400" y="310" text-anchor="middle" fill="#94a3b8" font-size="11">Each request carries its own</text>
  <text x="400" y="325" text-anchor="middle" fill="#94a3b8" font-size="11">auth token — no server session</text>

  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#facc15"/>
    </marker>
  </defs>
</svg>

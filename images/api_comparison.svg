<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" font-family="Verdana, sans-serif">
  <rect width="900" height="620" fill="#0f172a"/>
  <text x="450" y="35" text-anchor="middle" fill="#e2e8f0" font-size="22" font-weight="bold">API Architectures at a Glance</text>

  <!-- SOAP row -->
  <rect x="30" y="60" width="120" height="40" rx="6" fill="#1e40af"/>
  <text x="90" y="85" text-anchor="middle" fill="white" font-size="13" font-weight="bold">SOAP</text>
  <line x1="160" y1="80" x2="500" y2="80" stroke="#facc15" stroke-width="2" marker-end="url(#a1)"/>
  <line x1="500" y1="90" x2="160" y2="90" stroke="#38bdf8" stroke-width="2" marker-end="url(#a1)"/>
  <text x="330" y="70" text-anchor="middle" fill="#94a3b8" font-size="11">XML request/response, strict schema</text>
  <rect x="510" y="60" width="150" height="40" rx="6" fill="#334155"/>
  <text x="585" y="85" text-anchor="middle" fill="#e2e8f0" font-size="11">Bank / Enterprise</text>

  <!-- REST row -->
  <rect x="30" y="130" width="120" height="40" rx="6" fill="#1e40af"/>
  <text x="90" y="155" text-anchor="middle" fill="white" font-size="13" font-weight="bold">REST</text>
  <line x1="160" y1="150" x2="500" y2="150" stroke="#facc15" stroke-width="2" marker-end="url(#a1)"/>
  <line x1="500" y1="160" x2="160" y2="160" stroke="#38bdf8" stroke-width="2" marker-end="url(#a1)"/>
  <text x="330" y="140" text-anchor="middle" fill="#94a3b8" font-size="11">JSON, stateless, resource URLs + verbs</text>
  <rect x="510" y="130" width="150" height="40" rx="6" fill="#334155"/>
  <text x="585" y="155" text-anchor="middle" fill="#e2e8f0" font-size="11">Public / Mobile APIs</text>

  <!-- GraphQL row -->
  <rect x="30" y="200" width="120" height="40" rx="6" fill="#7e22ce"/>
  <text x="90" y="225" text-anchor="middle" fill="white" font-size="13" font-weight="bold">GraphQL</text>
  <line x1="160" y1="220" x2="500" y2="220" stroke="#facc15" stroke-width="2" marker-end="url(#a1)"/>
  <line x1="500" y1="230" x2="160" y2="230" stroke="#38bdf8" stroke-width="2" marker-end="url(#a1)"/>
  <text x="330" y="210" text-anchor="middle" fill="#94a3b8" font-size="11">Single endpoint, client-defined query shape</text>
  <rect x="510" y="200" width="150" height="40" rx="6" fill="#334155"/>
  <text x="585" y="225" text-anchor="middle" fill="#e2e8f0" font-size="11">Nested / Relational Data</text>

  <!-- gRPC row -->
  <rect x="30" y="270" width="120" height="40" rx="6" fill="#166534"/>
  <text x="90" y="295" text-anchor="middle" fill="white" font-size="13" font-weight="bold">gRPC</text>
  <line x1="160" y1="285" x2="500" y2="285" stroke="#facc15" stroke-width="2" marker-end="url(#a1)"/>
  <line x1="500" y1="295" x2="160" y2="295" stroke="#38bdf8" stroke-width="2" marker-end="url(#a1)"/>
  <line x1="500" y1="305" x2="160" y2="305" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#a1)"/>
  <text x="330" y="275" text-anchor="middle" fill="#94a3b8" font-size="11">Binary protobuf, HTTP/2, streaming</text>
  <rect x="510" y="270" width="150" height="40" rx="6" fill="#334155"/>
  <text x="585" y="295" text-anchor="middle" fill="#e2e8f0" font-size="11">Internal Microservices</text>

  <!-- WebSocket row -->
  <rect x="30" y="340" width="120" height="40" rx="6" fill="#be123c"/>
  <text x="90" y="365" text-anchor="middle" fill="white" font-size="13" font-weight="bold">WebSocket</text>
  <line x1="160" y1="352" x2="500" y2="352" stroke="#f472b6" stroke-width="2" marker-end="url(#a1)"/>
  <line x1="500" y1="368" x2="160" y2="368" stroke="#a3e635" stroke-width="2" marker-end="url(#a1)"/>
  <text x="330" y="345" text-anchor="middle" fill="#94a3b8" font-size="11">Persistent full-duplex, either side pushes</text>
  <rect x="510" y="340" width="150" height="40" rx="6" fill="#334155"/>
  <text x="585" y="365" text-anchor="middle" fill="#e2e8f0" font-size="11">Chat / Live / Games</text>

  <!-- WebHook row -->
  <rect x="30" y="410" width="120" height="40" rx="6" fill="#a16207"/>
  <text x="90" y="435" text-anchor="middle" fill="white" font-size="13" font-weight="bold">WebHook</text>
  <line x1="160" y1="430" x2="500" y2="430" stroke="#facc15" stroke-width="2.5" marker-end="url(#a1)"/>
  <text x="330" y="420" text-anchor="middle" fill="#94a3b8" font-size="11">One-shot event-triggered POST (push only)</text>
  <rect x="510" y="410" width="150" height="40" rx="6" fill="#334155"/>
  <text x="585" y="435" text-anchor="middle" fill="#e2e8f0" font-size="11">Event Notifications</text>

  <rect x="700" y="60" width="170" height="390" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="785" y="85" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="bold">Key Idea</text>
  <text x="712" y="115" fill="#94a3b8" font-size="11">SOAP: strict &amp; secure</text>
  <text x="712" y="135" fill="#94a3b8" font-size="11">REST: simple &amp; universal</text>
  <text x="712" y="155" fill="#94a3b8" font-size="11">GraphQL: precise fetching</text>
  <text x="712" y="175" fill="#94a3b8" font-size="11">gRPC: raw speed</text>
  <text x="712" y="195" fill="#94a3b8" font-size="11">WebSocket: two-way live</text>
  <text x="712" y="215" fill="#94a3b8" font-size="11">WebHook: event push</text>

  <defs>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#facc15"/>
    </marker>
  </defs>

  <text x="450" y="500" text-anchor="middle" fill="#64748b" font-size="13">Each protocol trades off simplicity, performance, and connection style differently.</text>
  <text x="450" y="520" text-anchor="middle" fill="#64748b" font-size="13">Choosing the right one depends on your data shape, latency needs, and client type.</text>
</svg>

<svg viewBox="0 0 800 430" xmlns="http://www.w3.org/2000/svg" font-family="Verdana, sans-serif">
  <rect width="800" height="430" fill="#0f172a"/>
  <text x="400" y="35" text-anchor="middle" fill="#e2e8f0" font-size="20" font-weight="bold">GraphQL: Single Endpoint, Precise Query Shape</text>

  <rect x="40" y="160" width="180" height="90" rx="10" fill="#1e40af" stroke="#93c5fd" stroke-width="2"/>
  <text x="130" y="200" text-anchor="middle" fill="white" font-size="16" font-weight="bold">Client</text>
  <text x="130" y="222" text-anchor="middle" fill="#cbd5e1" font-size="12">(Dashboard UI)</text>

  <rect x="330" y="160" width="180" height="90" rx="10" fill="#7e22ce" stroke="#e9d5ff" stroke-width="2"/>
  <text x="420" y="195" text-anchor="middle" fill="white" font-size="15" font-weight="bold">GraphQL Server</text>
  <text x="420" y="215" text-anchor="middle" fill="#f3e8ff" font-size="11">/graphql endpoint</text>
  <text x="420" y="232" text-anchor="middle" fill="#f3e8ff" font-size="11">Resolvers + Schema</text>

  <rect x="610" y="80" width="150" height="55" rx="8" fill="#166534" stroke="#86efac" stroke-width="1.5"/>
  <text x="685" y="112" text-anchor="middle" fill="white" font-size="12">Users DB</text>

  <rect x="610" y="160" width="150" height="55" rx="8" fill="#166534" stroke="#86efac" stroke-width="1.5"/>
  <text x="685" y="192" text-anchor="middle" fill="white" font-size="12">Repos Service</text>

  <rect x="610" y="240" width="150" height="55" rx="8" fill="#166534" stroke="#86efac" stroke-width="1.5"/>
  <text x="685" y="272" text-anchor="middle" fill="white" font-size="12">Stars Service</text>

  <line x1="220" y1="190" x2="330" y2="190" stroke="#facc15" stroke-width="2.5" marker-end="url(#arrow3)"/>
  <text x="275" y="177" text-anchor="middle" fill="#facc15" font-size="10">1. query {...}</text>

  <line x1="510" y1="175" x2="610" y2="115" stroke="#e9d5ff" stroke-width="1.5" marker-end="url(#arrow3)"/>
  <line x1="510" y1="195" x2="610" y2="190" stroke="#e9d5ff" stroke-width="1.5" marker-end="url(#arrow3)"/>
  <line x1="510" y1="215" x2="610" y2="265" stroke="#e9d5ff" stroke-width="1.5" marker-end="url(#arrow3)"/>
  <text x="555" y="145" fill="#e9d5ff" font-size="10">2. resolvers fetch</text>
  <text x="555" y="245" fill="#e9d5ff" font-size="10">each field</text>

  <line x1="330" y1="240" x2="220" y2="240" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow3)"/>
  <text x="275" y="258" text-anchor="middle" fill="#38bdf8" font-size="10">3. exact shape JSON</text>

  <rect x="40" y="290" width="470" height="110" rx="8" fill="#334155" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="55" y="312" fill="#e2e8f0" font-size="12" font-weight="bold">Query sent:</text>
  <text x="55" y="330" fill="#94a3b8" font-size="11" font-family="monospace">{ user(login:"octocat"){ name repositories(first:5){</text>
  <text x="55" y="346" fill="#94a3b8" font-size="11" font-family="monospace">  name stargazerCount } } }</text>
  <text x="55" y="370" fill="#e2e8f0" font-size="12" font-weight="bold">Response shape matches exactly — no over/under-fetching</text>

  <defs>
    <marker id="arrow3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#facc15"/>
    </marker>
  </defs>
</svg>

<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" font-family="Verdana, sans-serif">
  <rect width="800" height="400" fill="#0f172a"/>
  <text x="400" y="35" text-anchor="middle" fill="#e2e8f0" font-size="20" font-weight="bold">WebHook: Event-Driven "Reverse API" Push</text>

  <rect x="40" y="150" width="190" height="90" rx="10" fill="#166534" stroke="#86efac" stroke-width="2"/>
  <text x="135" y="185" text-anchor="middle" fill="white" font-size="15" font-weight="bold">Event Source</text>
  <text x="135" y="205" text-anchor="middle" fill="#dcfce7" font-size="11">(Stripe Payments)</text>

  <rect x="570" y="150" width="190" height="90" rx="10" fill="#1e40af" stroke="#93c5fd" stroke-width="2"/>
  <text x="665" y="185" text-anchor="middle" fill="white" font-size="15" font-weight="bold">Your Server</text>
  <text x="665" y="205" text-anchor="middle" fill="#cbd5e1" font-size="11">(Registered URL)</text>

  <rect x="260" y="60" width="280" height="45" rx="8" fill="#334155" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="400" y="87" text-anchor="middle" fill="#e2e8f0" font-size="12">0. Webhook URL registered in advance</text>

  <circle cx="135" cy="270" r="26" fill="#facc15"/>
  <text x="135" y="275" text-anchor="middle" fill="#1e293b" font-size="10" font-weight="bold">Event!</text>

  <line x1="230" y1="200" x2="570" y2="200" stroke="#facc15" stroke-width="2.5" marker-end="url(#arrow6)"/>
  <text x="400" y="187" text-anchor="middle" fill="#facc15" font-size="11">1. POST /webhooks/stripe { event, data }</text>
  <text x="400" y="217" text-anchor="middle" fill="#94a3b8" font-size="10">Header: X-Signature (HMAC)</text>

  <line x1="570" y1="230" x2="230" y2="230" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow6)"/>
  <text x="400" y="250" text-anchor="middle" fill="#38bdf8" font-size="11">3. 200 OK (acknowledge)</text>

  <rect x="590" y="270" width="150" height="70" rx="8" fill="#334155" stroke="#64748b" stroke-width="1.5"/>
  <text x="665" y="292" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="bold">2. Verify signature</text>
  <text x="665" y="308" text-anchor="middle" fill="#94a3b8" font-size="10">Update order DB</text>
  <text x="665" y="323" text-anchor="middle" fill="#94a3b8" font-size="10">Trigger shipping</text>

  <text x="400" y="375" text-anchor="middle" fill="#64748b" font-size="12">One-shot HTTP POST — no persistent connection, unlike WebSocket</text>

  <defs>
    <marker id="arrow6" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#facc15"/>
    </marker>
  </defs>
</svg>

<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" font-family="Verdana, sans-serif">
  <rect width="800" height="400" fill="#0f172a"/>
  <text x="400" y="35" text-anchor="middle" fill="#e2e8f0" font-size="20" font-weight="bold">gRPC: Binary Protobuf over HTTP/2 Streaming</text>

  <rect x="40" y="150" width="190" height="90" rx="10" fill="#1e40af" stroke="#93c5fd" stroke-width="2"/>
  <text x="135" y="188" text-anchor="middle" fill="white" font-size="15" font-weight="bold">Trip Service</text>
  <text x="135" y="208" text-anchor="middle" fill="#cbd5e1" font-size="11">(gRPC Client, Java)</text>

  <rect x="570" y="150" width="190" height="90" rx="10" fill="#166534" stroke="#86efac" stroke-width="2"/>
  <text x="665" y="188" text-anchor="middle" fill="white" font-size="15" font-weight="bold">Location Service</text>
  <text x="665" y="208" text-anchor="middle" fill="#dcfce7" font-size="11">(gRPC Server, Go)</text>

  <rect x="260" y="80" width="280" height="45" rx="8" fill="#334155" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="400" y="107" text-anchor="middle" fill="#e2e8f0" font-size="12">Shared contract: service.proto</text>

  <line x1="230" y1="180" x2="570" y2="180" stroke="#facc15" stroke-width="2.5" marker-end="url(#arrow4)"/>
  <text x="400" y="167" text-anchor="middle" fill="#facc15" font-size="11">1. GetLiveLocation(tripId) — binary protobuf</text>

  <line x1="570" y1="205" x2="230" y2="205" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow4)"/>
  <line x1="570" y1="215" x2="230" y2="215" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow4)"/>
  <line x1="570" y1="225" x2="230" y2="225" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow4)"/>
  <text x="400" y="250" text-anchor="middle" fill="#38bdf8" font-size="11">2. stream LocationUpdate {lat,lng,ts} × N (single connection)</text>

  <rect x="150" y="300" width="500" height="65" rx="8" fill="#334155" stroke="#64748b" stroke-width="1.5"/>
  <text x="400" y="322" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="bold">One persistent HTTP/2 connection, multiplexed</text>
  <text x="400" y="342" text-anchor="middle" fill="#94a3b8" font-size="11">Compact binary payload — much smaller &amp; faster than JSON/XML</text>

  <defs>
    <marker id="arrow4" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#facc15"/>
    </marker>
  </defs>
</svg>
